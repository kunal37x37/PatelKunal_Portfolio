<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunal Patel | Portfolio Redirect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .container {
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Redirecting to Portfolio...</h1>
        <p>Please wait while we load the best experience for your device</p>
    </div>

    <script>
        (function() {
            // Device detection function
            function detectDevice() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                
                // Check for mobile devices
                const isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent.toLowerCase());
                
                // Check for tablets (iPad specifically)
                const isTablet = /ipad|tablet|(android(?!.*mobile))/i.test(userAgent.toLowerCase()) || 
                                (window.innerWidth >= 768 && window.innerWidth <= 1024);
                
                // Log for debugging
                console.log('Device Detection:', {
                    userAgent: userAgent,
                    isMobile: isMobile,
                    isTablet: isTablet,
                    width: window.innerWidth,
                    height: window.innerHeight
                });
                
                // Return device type
                if (isMobile && !isTablet) {
                    return 'mobile';
                } else {
                    return 'desktop'; // Includes desktop and tablet
                }
            }

            // Get device type
            const deviceType = detectDevice();
            
            // Set redirect URLs
            const desktopPortfolio = 'Portfolio-1/'; // First portfolio (Aurora Galaxy)
            const mobilePortfolio = 'Portfolio-2/';   // Second portfolio (Simple)
            
            // Redirect based on device
            if (deviceType === 'mobile') {
                console.log('Redirecting to mobile portfolio...');
                window.location.href = mobilePortfolio;
            } else {
                console.log('Redirecting to desktop portfolio...');
                window.location.href = desktopPortfolio;
            }
        })();
    </script>
</body>
</html>
