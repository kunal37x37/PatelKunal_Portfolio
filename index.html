<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunal Patel | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .device-info {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
            text-align: left;
        }
        
        .device-info p {
            margin: 5px 0;
        }
        
        .manual-links {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .manual-link {
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 50px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .manual-link:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }
        
        .manual-link i {
            margin-right: 8px;
        }
    </style>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>🚀 Kunal Patel Portfolio</h1>
        <p>Detecting your device to show the best experience...</p>
        
        <div class="loader"></div>
        
        <div class="device-info" id="deviceInfo">
            <p><i class="fas fa-mobile-alt"></i> <strong>Detecting device...</strong></p>
        </div>
        
        <div class="manual-links">
            <a href="Portfolio-1/" class="manual-link" id="desktopLink">
                <i class="fas fa-desktop"></i> Desktop Version
            </a>
            <a href="Portfolio-2/" class="manual-link" id="mobileLink">
                <i class="fas fa-mobile-alt"></i> Mobile Version
            </a>
        </div>
    </div>

    <script>
        // FORCEFUL DEVICE DETECTION - Ye kaam karega
        (function() {
            // Get device info element
            const deviceInfo = document.getElementById('deviceInfo');
            
            // Screen dimensions
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // User agent
            const ua = navigator.userAgent.toLowerCase();
            
            // Detect mobile devices (FORCEFUL DETECTION)
            const isMobile = /android|webos|iphone|ipod|blackberry|iemobile|opera mini|mobile|tablet|ipad/i.test(ua) || width <= 768;
            
            // Detect tablet
            const isTablet = /ipad|tablet/i.test(ua) || (width >= 768 && width <= 1024 && !isMobile);
            
            // Final device type
            let deviceType = 'desktop';
            let redirectUrl = 'Portfolio-1/'; // Default desktop
            
            if (isMobile) {
                deviceType = 'mobile';
                redirectUrl = 'Portfolio-2/';
            } else if (isTablet) {
                deviceType = 'tablet';
                redirectUrl = 'Portfolio-1/'; // Tablet par bhi desktop version
            }
            
            // Display device info
            deviceInfo.innerHTML = `
                <p><i class="fas fa-info-circle"></i> <strong>Device Information:</strong></p>
                <p><i class="fas fa-desktop"></i> Screen: ${width} x ${height}px</p>
                <p><i class="fas fa-globe"></i> User Agent: ${ua.substring(0, 50)}...</p>
                <p><i class="fas fa-${deviceType === 'mobile' ? 'mobile-alt' : 'desktop'}"></i> <strong>Detected: ${deviceType.toUpperCase()}</strong></p>
                <p style="color: #ffd700; margin-top: 10px;"><i class="fas fa-arrow-right"></i> Redirecting to ${deviceType === 'mobile' ? 'MOBILE' : 'DESKTOP'} portfolio...</p>
            `;
            
            // Log to console
            console.log('===== DEVICE DETECTION =====');
            console.log('Screen Width:', width);
            console.log('Screen Height:', height);
            console.log('Is Mobile:', isMobile);
            console.log('Is Tablet:', isTablet);
            console.log('Device Type:', deviceType);
            console.log('Redirecting to:', redirectUrl);
            console.log('============================');
            
            // REDIRECT AFTER 2 SECONDS
            setTimeout(function() {
                console.log('Redirecting now...');
                window.location.href = redirectUrl;
            }, 2000);
        })();
    </script>
</body>
</html>
